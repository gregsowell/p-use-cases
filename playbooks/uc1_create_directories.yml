---
# UC1 step 3: create the directories on RHEL and/or AIX targets.
# The request is re-validated here so this job is safe to launch on its own.
- name: UC1 | Create requested directories
  hosts: "{{ target_hosts | default('') | regex_replace('[\\s;]+', ',') }}"
  gather_facts: false
  become: true

  pre_tasks:
    # Static import so any_errors_fatal applies to every validation task:
    # a rejected request must stop all hosts, not just the first one.
    - name: Validate the request before touching any host
      ansible.builtin.import_role:
        name: directory_provision
        tasks_from: validate.yml
      any_errors_fatal: true

  roles:
    - role: directory_provision
      vars:
        dp_skip_validation: true

- name: UC1 | Summarise the results
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Build the provisioning report
      ansible.builtin.include_role:
        name: directory_provision
        tasks_from: report.yml
      vars:
        dp_report_hosts: "{{ lookup('ansible.builtin.inventory_hostnames', target_hosts | default('') | regex_replace('[\\s;]+', ','), wantlist=True) }}"
