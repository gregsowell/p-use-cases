---
# Environment-specific settings. Override any of these as extra vars on the
# "Use Cases - Configure AAP" job template rather than committing secrets.

uc_organization: Default

# infra.aap_configuration waits on async API work (e.g. project syncs) for
# retries x delay seconds. Project syncs can take a couple of minutes.
aap_configuration_async_retries: 120
aap_configuration_async_delay: 5

# Git repository that AAP (controller + EDA) syncs this content from.
uc_scm_url: https://github.com/gregsowell/p-use-cases.git
uc_scm_branch: main

# Existing objects referenced by name (not created by this content).
uc_inventory: generic-lab                        # must contain the target hosts
uc_machine_credential: generic-lab-root         # SSH user with root/sudo on targets
uc_execution_environment: "Default execution environment"
uc_decision_environment: "Hub Default Decision Environment"
uc_eda_aap_credential: Controller               # EDA credential of type "Red Hat Ansible Automation Platform"
uc_aap_credential: aap                          # controller credential of the same type (lab reset job)

# UC1 survey defaults (a request that works as-is against the lab)
uc_uc1_default_targets: node01
uc_uc1_default_directories: "/app/demo/data, /app/demo/logs"
uc_uc1_default_owner: nobody
uc_uc1_default_group: nobody
uc_uc1_default_mode: "2775"

# UC2 survey defaults
uc_uc2_default_targets: node01                  # e.g. aix_servers in an AIX estate
uc_uc2_default_paths: "/var, /tmp"
uc_uc2_default_incident: INC0010042             # mock mode prints the work note for it
uc_uc2_default_deep_dive: "yes"
uc_snow_mode: mock                              # mock | live

# Lab reset survey defaults
uc_reset_default_targets: node01

# Alert simulator survey defaults
uc_sim_default_host: node01
uc_sim_default_path: /var
uc_sim_default_incident: INC0010042

# ---------------------------------------------------------------------------
# Placeholder secrets. Pass real values as extra vars at launch time;
# never commit them. update_secrets is off, so re-runs keep what is in AAP.
# ---------------------------------------------------------------------------
uc_netcool_stream_token: "change-me-netcool-token"
uc_dynatrace_stream_username: dynatrace
uc_dynatrace_stream_password: "change-me-dynatrace-password"
uc_snow_instance: "https://devXXXXX.service-now.com"
uc_snow_username: admin
uc_snow_password: "change-me"
