---
controller_templates:
  # --- Lab reset: run before (and after) a demo ------------------------------
  - name: Use Cases - Reset Lab
    description: Removes UC1 demo directories, stages a large file for UC2, denies stale approvals, restarts the EDA activation
    organization: "{{ uc_organization }}"
    project: AAP Use Cases
    playbook: playbooks/lab_reset.yml
    inventory: "{{ uc_inventory }}"
    execution_environment: "{{ uc_execution_environment }}"
    credentials:
      - "{{ uc_machine_credential }}"
      - "{{ uc_aap_credential }}"
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec:
      name: Lab reset
      description: Return the demo lab to a known starting point
      spec:
        - question_name: Target servers
          question_description: Hosts to clean (only /app/demo, /tmp/uc-demo and the demo file are removed)
          variable: target_hosts
          type: text
          required: true
          min: 1
          max: 1024
          default: "{{ uc_reset_default_targets }}"
        - question_name: Stage a 2 GB file for the UC2 deep dive?
          question_description: Creates /tmp/uc-demo-bigfile so "large recent files" has a finding
          variable: stage_bigfile
          type: multiplechoice
          required: true
          choices:
            - "yes"
            - "no"
          default: "yes"
        - question_name: Restart the EDA activation?
          question_description: Clears the 15-minute alert throttle so alerts can be replayed immediately
          variable: restart_activation
          type: multiplechoice
          required: true
          choices:
            - "yes"
            - "no"
          default: "yes"
        - question_name: Deny pending UC1 approvals?
          question_description: Cleans up approvals left waiting by earlier runs
          variable: deny_pending_approvals
          type: multiplechoice
          required: true
          choices:
            - "yes"
            - "no"
          default: "yes"

  # --- UC2: alert simulator (stands in for Netcool / Dynatrace) -------------
  - name: UC2 - Simulate Monitoring Alert
    description: Posts a representative Netcool or Dynatrace alert to its EDA event stream and reports the workflow it triggers
    organization: "{{ uc_organization }}"
    project: AAP Use Cases
    playbook: playbooks/uc2_simulate_alert.yml
    inventory: "{{ uc_inventory }}"
    execution_environment: "{{ uc_execution_environment }}"
    credentials:
      - "{{ uc_aap_credential }}"
      - Use Cases - Event Stream Secrets
    ask_variables_on_launch: true
    allow_simultaneous: true
    survey_enabled: true
    survey_spec:
      name: Simulated monitoring alert
      description: Send a test alert through Event-Driven Ansible
      spec:
        - question_name: Alert type
          question_description: "netcool = filesystem alert; netcool-clear = resolution (ignored by the rulebook); dynatrace = low disk space problem"
          variable: alert_type
          type: multiplechoice
          required: true
          choices:
            - netcool
            - netcool-clear
            - dynatrace
          default: netcool
        - question_name: Server
          question_description: Host named in the alert (an FQDN such as node01.lab.example.com shows inventory name mapping)
          variable: alert_host
          type: text
          required: true
          min: 1
          max: 255
          default: "{{ uc_sim_default_host }}"
        - question_name: Directory or mount point
          question_description: Filesystem the alert is about
          variable: alert_path
          type: text
          required: true
          min: 1
          max: 255
          default: "{{ uc_sim_default_path }}"
        - question_name: ServiceNow incident (Netcool only)
          question_description: Sent as the Netcool TTNumber field
          variable: alert_incident
          type: text
          required: false
          min: 0
          max: 40
          default: "{{ uc_sim_default_incident }}"

  # --- UC1: self-service directory provisioning -----------------------------
  - name: UC1 - Validate Directory Request
    description: Guardrail checks on a directory request (runs before approval)
    organization: "{{ uc_organization }}"
    project: AAP Use Cases
    playbook: playbooks/uc1_validate_request.yml
    inventory: "{{ uc_inventory }}"
    execution_environment: "{{ uc_execution_environment }}"
    ask_variables_on_launch: true
    allow_simultaneous: true

  - name: UC1 - Create Directories
    description: Creates directories with the requested owner/group/mode on RHEL or AIX
    organization: "{{ uc_organization }}"
    project: AAP Use Cases
    playbook: playbooks/uc1_create_directories.yml
    inventory: "{{ uc_inventory }}"
    execution_environment: "{{ uc_execution_environment }}"
    credentials:
      - "{{ uc_machine_credential }}"
    ask_variables_on_launch: true
    allow_simultaneous: true

  # --- UC2: storage utilization reporting + incident enrichment -------------
  - name: UC2 - Collect Storage Utilization
    description: Read-only filesystem utilization (and optional deep dive) for hosts/paths from a survey or alert
    organization: "{{ uc_organization }}"
    project: AAP Use Cases
    playbook: playbooks/uc2_storage_report.yml
    inventory: "{{ uc_inventory }}"
    execution_environment: "{{ uc_execution_environment }}"
    credentials:
      - "{{ uc_machine_credential }}"
    ask_variables_on_launch: true
    allow_simultaneous: true

  - name: UC2 - Update ServiceNow Incident
    description: Adds the storage report to the related ServiceNow incident as a work note
    organization: "{{ uc_organization }}"
    project: AAP Use Cases
    playbook: playbooks/uc2_update_incident.yml
    inventory: "{{ uc_inventory }}"
    execution_environment: "{{ uc_execution_environment }}"
    credentials:
      - UC2 - ServiceNow
    extra_vars:
      snow_mode: "{{ uc_snow_mode }}"
    ask_variables_on_launch: true
    allow_simultaneous: true
