---
controller_credential_types:
  - name: ServiceNow ITSM (use cases)
    description: Injects SN_HOST / SN_USERNAME / SN_PASSWORD for the servicenow.itsm collection
    kind: cloud
    inputs:
      fields:
        - id: instance
          type: string
          label: Instance URL
        - id: username
          type: string
          label: Username
        - id: password
          type: string
          label: Password
          secret: true
      required:
        - instance
        - username
        - password
    injectors:
      env:
        SN_HOST: !unsafe "{{ instance }}"
        SN_USERNAME: !unsafe "{{ username }}"
        SN_PASSWORD: !unsafe "{{ password }}"

  # Holds the event stream secrets once, encrypted in AAP. Injected as extra
  # vars so both the alert simulator and "Configure AAP" (attach it there too)
  # use the same values that the EDA event stream credentials were built with.
  - name: Event Stream Secrets (use cases)
    description: Injects uc_netcool_stream_token / uc_dynatrace_stream_username / uc_dynatrace_stream_password
    kind: cloud
    inputs:
      fields:
        - id: netcool_token
          type: string
          label: Netcool event stream token
          secret: true
        - id: dynatrace_username
          type: string
          label: Dynatrace event stream username
        - id: dynatrace_password
          type: string
          label: Dynatrace event stream password
          secret: true
      required:
        - netcool_token
        - dynatrace_username
        - dynatrace_password
    injectors:
      extra_vars:
        uc_netcool_stream_token: !unsafe "{{ netcool_token }}"
        uc_dynatrace_stream_username: !unsafe "{{ dynatrace_username }}"
        uc_dynatrace_stream_password: !unsafe "{{ dynatrace_password }}"

controller_credentials:
  - name: Use Cases - Event Stream Secrets
    description: Secrets for the UC2 event streams (used by the alert simulator and config as code)
    organization: "{{ uc_organization }}"
    credential_type: Event Stream Secrets (use cases)
    update_secrets: false
    inputs:
      netcool_token: "{{ uc_netcool_stream_token }}"
      dynatrace_username: "{{ uc_dynatrace_stream_username }}"
      dynatrace_password: "{{ uc_dynatrace_stream_password }}"

  - name: UC2 - ServiceNow
    description: ServiceNow instance for incident enrichment (UC2)
    organization: "{{ uc_organization }}"
    credential_type: ServiceNow ITSM (use cases)
    update_secrets: false
    inputs:
      instance: "{{ uc_snow_instance }}"
      username: "{{ uc_snow_username }}"
      password: "{{ uc_snow_password }}"

controller_projects:
  - name: AAP Use Cases
    description: Self-service directories (UC1) and storage reporting with EDA enrichment (UC2)
    organization: "{{ uc_organization }}"
    scm_type: git
    scm_url: "{{ uc_scm_url }}"
    scm_branch: "{{ uc_scm_branch }}"
    scm_update_on_launch: true
    update_project: true
    wait: true
